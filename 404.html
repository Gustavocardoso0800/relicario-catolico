<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Relicário Católico</title>
  <link rel="icon" type="image/png"
        href="/relicario-catolico/assets/logo.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fbf9f5;
      color: #302720;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 8%;
      background: #fff;
      border-bottom: 1px solid #e9e1d7;
    }

    header img { width: 190px; max-width: 100%; }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 60px 24px;
      text-align: center;
    }

    .conteudo { max-width: 560px; }

    .numero {
      margin: 0;
      color: #b18a50;
      font: 100px/1 Georgia, serif;
    }

    h1 {
      color: #641c27;
      font: 36px Georgia, serif;
    }

    p { color: #796e65; line-height: 1.6; }

    .botoes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .botoes a {
      padding: 14px 22px;
      border: 1px solid #641c27;
      color: #641c27;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
    }

    .botoes a:first-child {
      background: #641c27;
      color: #fff;
    }

    footer {
      padding: 24px;
      background: #32181a;
      color: #c4b6aa;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <a href="/relicario-catolico/">
      <img src="/relicario-catolico/assets/logo.png"
           alt="Relicário Católico">
    </a>
  </header>

  <main>
    <div class="conteudo">
      <p class="numero">404</p>
      <h1>Não encontramos esta página.</h1>
      <p>
        O endereço pode ter mudado ou estar incorreto.
        Volte ao início ou conheça nosso catálogo.
      </p>

      <div class="botoes">
        <a href="/relicario-catolico/">Voltar ao início</a>
        <a href="/relicario-catolico/catalogo.html">
          Conhecer nosso catálogo
        </a>
      </div>
    </div>
  </main>

  <footer>Relicário Católico · Breves, Pará</footer>
</body>
</html>
