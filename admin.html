<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | Relicário Católico</title><style>body{margin:0;background:#f8f5ef;color:#342a27;font:16px Arial}main{max-width:760px;margin:40px auto;padding:0 18px}h1{font:36px Georgia;color:#651d29}section{background:white;padding:22px;border:1px solid #e5d9cc;margin:20px 0}label{display:block;font-weight:600;margin:14px 0 6px}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #bcb1a5}input[type=checkbox]{width:auto}button{padding:12px 16px;background:#651d29;color:white;border:0;cursor:pointer;margin:10px 8px 0 0}small{color:#665c55}#lista button{display:block;background:#f2eee8;color:#322623;width:100%;text-align:left}#mensagem{white-space:pre-wrap}img{height:90px;max-width:100px;object-fit:cover}</style><script defer src="supabase-config.js"></script><script defer src="supabase-client.js"></script><script defer src="admin-online.js"></script></head><body><main><a href="index.html">Voltar à loja</a><h1>Administração da loja</h1><p id="mensagem" role="status"></p><section id="login"><h2>Entrar</h2><form id="login-form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><button>Entrar</button></form></section><section id="painel" hidden><button id="sair" type="button">Sair</button><h2>Produtos</h2><div id="lista"></div><button id="novo" type="button">Novo produto</button><form id="produto"><label for="nome">Nome</label><input id="nome" required maxlength="200"><label for="autor">Autor ou marca</label><input id="autor"><label for="categoria">Categoria</label><select id="categoria"><option>Livros</option><option>Artigos católicos</option></select><label for="detalhe">Descrição</label><textarea id="detalhe"></textarea><label for="preco">Preço em reais</label><input id="preco" type="number" min="0" step="0.01" placeholder="Deixe vazio para consultar"><label for="estoque">Quantidade disponível</label><input id="estoque" type="number" min="0" step="1" placeholder="Deixe vazio para não limitar"><label><input id="vendido" type="checkbox"> Marcar como esgotado</label><label for="etiqueta">Etiqueta</label><input id="etiqueta"><label for="foto">Adicionar fotos</label><input id="foto" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Até 5 MB por foto. As fotos serão enviadas ao salvar.</small><div id="fotos"></div><button type="submit">Salvar produto</button><button type="button" id="excluir">Excluir produto</button></form></section></main></body></html>
